name: Validate Native Desktop Builds

on:
  workflow_dispatch:

env:
  VITE_APP_MODE: ${{ vars.VITE_APP_MODE || 'hybrid' }}
  VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://hader-saud-2027.vercel.app' }}
  VITE_ALLOW_LOCAL_FALLBACK: ${{ vars.VITE_ALLOW_LOCAL_FALLBACK || 'false' }}
  VITE_ENABLE_BOOTSTRAP_ADMIN: 'false'
  VITE_DESKTOP_RELEASE_URL: https://github.com/HimArt-1/HADER-SAUD-2027/releases/latest/download/desktop-manifest.json
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-macos:
    name: Validate macOS universal DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run electron:build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: hader-macos-validation
          path: release/Hader-*-mac-universal.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Validate Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run electron:build:win
      - uses: actions/upload-artifact@v4
        with:
          name: hader-windows-validation
          path: release/Hader-*-windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7
