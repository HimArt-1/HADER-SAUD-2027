name: Publish Native Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_APP_MODE: ${{ vars.VITE_APP_MODE || 'hybrid' }}
  VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://hader-saud-2027.vercel.app' }}
  VITE_ALLOW_LOCAL_FALLBACK: ${{ vars.VITE_ALLOW_LOCAL_FALLBACK || 'false' }}
  VITE_ENABLE_BOOTSTRAP_ADMIN: 'false'
  VITE_DESKTOP_RELEASE_URL: https://github.com/HimArt-1/HADER-SAUD-2027/releases/latest/download/desktop-manifest.json
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  validate-release:
    name: Validate release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require signing configuration
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          REQUIRED_SIGNING_VALUES=(
            MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          )
          for NAME in "${REQUIRED_SIGNING_VALUES[@]}"; do
            if [[ -z "${!NAME}" ]]; then
              echo "::error::Configure the $NAME GitHub Actions secret before publishing."
              exit 1
            fi
          done

      - name: Match tag to package version
        shell: bash
        run: |
          PACKAGE_TAG="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$PACKAGE_TAG" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match package version $PACKAGE_TAG."
            exit 1
          fi

  build-macos:
    name: Build macOS universal DMG
    needs: validate-release
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native macOS installer
        run: npm run electron:build:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-universal/نظام حاضر.app"
          xcrun stapler validate "release/mac-universal/نظام حاضر.app"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: hader-macos
          path: release/Hader-*-mac-universal.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64 installer
    needs: validate-release
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native Windows installer
        run: npm run electron:build:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify Windows Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-Item "release/Hader-*-windows-x64-Setup.exe"
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Invalid Authenticode signature: $($signature.Status)"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: hader-windows
          path: release/Hader-*-windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release and manifest
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Setup Node.js for manifest generation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate desktop release manifest
        run: >-
          node --experimental-strip-types scripts/desktopReleaseManifest.ts
          release-assets
          "$GITHUB_REPOSITORY"
          "$GITHUB_REF_NAME"
          release-assets/desktop-manifest.json

      - name: Publish native desktop release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/desktop-manifest.json
