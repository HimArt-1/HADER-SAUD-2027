; supervisorctl يحتاج مقبساً ليتصل به. بدون هذه الأقسام الثلاثة كان
; "docker exec hader-whatsapp supervisorctl status" يردّ
; "unix:///var/run/supervisor.sock no such file"، أي أن إجراء الطوارئ
; الموثّق (تشغيل x11vnc و novnc يدوياً) لم يكن ليعمل أصلاً.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/app/whatsapp/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info

; ── Xvfb: Virtual Display ────────────────────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── x11vnc: VNC Server (Optional emergency fallback) ──────────
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbauth /root/.vnc/passwd -rfbport 5900 -xkb -noxrecord -noxfixes -noxdamage
autostart=false
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── noVNC: Web-based VNC Client (Optional emergency fallback) ──
[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
autostart=false
autorestart=true
priority=30
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── WhatsApp Server (Production WSGI) ─────────────────────────
[program:whatsapp-server]
command=gunicorn --workers 1 --threads 8 --worker-class gthread --bind 0.0.0.0:5001 --timeout 120 --graceful-timeout 60 "server:app"
directory=/app/whatsapp
user=hader
autorestart=true
priority=40
startsecs=5
stopwaitsecs=75
environment=HOME="/home/hader",USER="hader",DISPLAY=":99",PYTHONUNBUFFERED="1"
stdout_logfile=/app/whatsapp/logs/server_stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/app/whatsapp/logs/server_stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
