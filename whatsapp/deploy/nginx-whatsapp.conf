server {
    listen 80;
    server_name _;

    # ── WhatsApp API (reverse proxy) ─────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;

        # CORS: المتصل الحقيقي هو دالة Vercel (خادم إلى خادم، بلا CORS أصلاً).
        # استبدل النطاق أدناه بنطاق حاضر لديك. النجمة تعني أن أي موقع يستطيع
        # محاولة النداء من متصفح الزائر، ولا داعي لذلك هنا.
        add_header 'Access-Control-Allow-Origin' 'https://hader-saud-2027.vercel.app' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-API-Key, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://hader-saud-2027.vercel.app';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-API-Key, Cache-Control';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }
    }

    # ── Root status endpoint ─────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── noVNC: غير منشور على الإنترنت، عن قصد ────────────────
    # شاشة VNC تعطي تحكماً كاملاً بالمتصفح الذي يحمل جلسة واتساب للمدرسة،
    # وكلمة مرور واحدة على منفذ عام ليست حاجزاً كافياً أمام ذلك. الخدمة نفسها
    # معطّلة افتراضياً (autostart=false في supervisord)، والوصول إليها عند
    # الطوارئ يكون عبر نفق SSH من جهازك:
    #
    #   ssh -L 6080:127.0.0.1:6080 root@your-server
    #   docker exec hader-whatsapp supervisorctl start x11vnc novnc
    #   # ثم افتح http://127.0.0.1:6080/vnc.html محلياً
    #
    # رمز QR نفسه لا يحتاج هذا أصلاً: /api/qr يعطيه عبر لوحة حاضر.
    location /vnc/ {
        return 404;
    }

    # File upload size
    client_max_body_size 10m;
}
