<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crystal Cavern Duel</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;

        overflow: hidden;
      }
      canvas {
        display: block;
        border-radius: 16px;
        border: 2px solid rgba(120, 180, 255, 0.25);

      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="540"></canvas>
